# Pipeline 1, Q1 (replay variant): a standalone Structured Streaming job that replays
# tag_reading_seed in wall-clock time and upserts plant.tag_current in Lakebase. Runs on
# serverless as low-latency micro-batch (foreachBatch), the contract's documented fallback
# to the native postgresql/RTM sink (Delta is not a valid real-time-mode source).
#
# Continuous job. The committed default is PAUSED so a plain `bundle deploy` never
# auto-starts a live stream into Lakebase; start it with:
#   databricks bundle deploy -t dev --var stream_pause_status=UNPAUSED
resources:
  jobs:
    a_ingest_stream:
      name: a_ironbark_ingest_stream
      max_concurrent_runs: 1
      continuous:
        pause_status: ${var.stream_pause_status}
      tasks:
        - task_key: replay_to_lakebase
          notebook_task:
            notebook_path: ../src/replay_to_lakebase.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              lakebase_project: ${var.lakebase_project}
              lakebase_branch: ${var.lakebase_branch}
              lakebase_endpoint: ${var.lakebase_endpoint}
              lakebase_database: ${var.lakebase_database}
              pg_schema: ${var.pg_schema}
              replay_speed: ${var.replay_speed}
              trigger_interval: ${var.trigger_interval}
              checkpoint_root: ${var.checkpoint_root}
