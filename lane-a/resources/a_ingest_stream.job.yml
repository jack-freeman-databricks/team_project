# Continuous job: looped snapshot micro-batch replaying the seed into Lakebase plant.tag_current.
# Each run loops (upsert every interval_seconds for loop_seconds) in active Python rather than a
# blocking stream, so it sidesteps the serverless kernel watchdog. loop_seconds defaults to 86400
# (a full 24h replay loop), so a run stays up all day; the continuous trigger restarts it only if
# it exits or fails, keeping tag_current live.
#
# Committed default is PAUSED so a plain `bundle deploy` never auto-starts it. Start with:
#   databricks bundle deploy -t dev --var stream_pause_status=UNPAUSED
resources:
  jobs:
    a_ingest_stream:
      name: a_ironbark_ingest_stream
      max_concurrent_runs: 1
      continuous:
        pause_status: ${var.stream_pause_status}
      tasks:
        - task_key: replay_to_lakebase
          notebook_task:
            notebook_path: ../src/replay_snapshot.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              lakebase_project: ${var.lakebase_project}
              lakebase_branch: ${var.lakebase_branch}
              lakebase_endpoint: ${var.lakebase_endpoint}
              lakebase_database: ${var.lakebase_database}
              pg_schema: ${var.pg_schema}
              replay_speed: ${var.replay_speed}
              interval_seconds: ${var.interval_seconds}
              loop_seconds: ${var.loop_seconds}
